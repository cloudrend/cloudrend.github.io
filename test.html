<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grand Casino - Public Color Game Display</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at center, #1e1b4b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      user-select: none;
    }
    header {
      width: 100%;
      max-width: 800px;
      margin-bottom: 16px;
      text-align: center;
    }
    .casino-title {
      font-size: 2.2rem;
      color: #facc15;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.6);
      margin-bottom: 4px;
    }
    .casino-subtitle {
      font-size: 0.9rem;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Room Bar */
    .room-bar {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      width: 100%;
      max-width: 800px;
    }
    .room-status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .room-status {
      font-size: 0.9rem;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #ef4444;
      box-shadow: 0 0 8px #ef4444;
    }
    .status-dot.online { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }

    .room-inputs {
      display: flex;
      gap: 8px;
    }
    input[type="text"] {
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      flex: 1;
      text-transform: uppercase;
      font-weight: bold;
      text-align: center;
      letter-spacing: 1px;
    }
    button {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: #1d4ed8; }
    button.btn-host { background: #059669; }
    button.btn-host:hover { background: #047857; }
    button.btn-toggle { background: #7c3aed; }
    button.btn-toggle:hover { background: #6d28d9; }

    /* Main Casino Table Frame */
    .casino-table {
      width: 100%;
      max-width: 800px;
      background: #064e3b;
      border: 8px solid #78350f;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,0,0,0.5);
    }

    .info-header {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }
    .stat-box { text-align: center; }
    .stat-label { font-size: 0.8rem; color: #a7f3d0; text-transform: uppercase; letter-spacing: 1px; }
    .stat-val { font-size: 1.8rem; font-weight: 800; color: #facc15; text-shadow: 0 2px 4px rgba(0,0,0,0.6); }

    /* Dice Box */
    .dice-area {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin: 20px 0 32px 0;
    }
    .die {
      width: 90px;
      height: 90px;
      border-radius: 18px;
      border: 4px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      background-color: #1e293b;
    }
    .die.rolling { animation: casinoShake 0.12s infinite alternate; }
    @keyframes casinoShake {
      0% { transform: rotate(-12deg) scale(0.92); }
      100% { transform: rotate(12deg) scale(1.08); }
    }

    /* Colors Grid */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .color-box {
      aspect-ratio: 1;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      cursor: pointer;
      border: 4px solid rgba(0,0,0,0.2);
      box-shadow: inset 0 0 10px rgba(0,0,0,0.3), 0 4px 8px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .color-box:active { transform: scale(0.95); }
    .color-box.winning {
      border-color: #fff;
      animation: winnerGlow 0.5s infinite alternate;
    }
    @keyframes winnerGlow {
      0% { box-shadow: 0 0 10px #fff, inset 0 0 10px #fff; }
      100% { box-shadow: 0 0 30px #facc15, inset 0 0 20px #facc15; }
    }

    .color-name { font-weight: 900; font-size: 1.2rem; text-shadow: 0 2px 4px rgba(0,0,0,0.8); text-transform: uppercase; }
    .color-bet-badge { background: rgba(0,0,0,0.7); padding: 4px 12px; border-radius: 20px; font-size: 0.95rem; font-weight: 800; color: #facc15; border: 1px solid rgba(250, 204, 21, 0.4); margin-top: 8px; }

    /* Swatches */
    .c-red { background-color: #dc2626; color: #fff; }
    .c-blue { background-color: #2563eb; color: #fff; }
    .c-yellow { background-color: #eab308; color: #000; }
    .c-green { background-color: #16a34a; color: #fff; }
    .c-pink { background-color: #db2777; color: #fff; }
    .c-white { background-color: #f1f5f9; color: #0f172a; }

    /* Interactive Betting Controls (Hidden on Display Mode) */
    .betting-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .chip-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      background: rgba(0,0,0,0.3);
      padding: 10px;
      border-radius: 50px;
    }
    .chip {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.85rem;
      border: 4px dashed rgba(255,255,255,0.6);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      transition: transform 0.15s;
    }
    .chip.selected {
      border: 4px solid #fff;
      transform: scale(1.15);
      box-shadow: 0 0 12px rgba(255,255,255,0.8);
    }
    .chip-10 { background: #2563eb; color: #fff; }
    .chip-50 { background: #dc2626; color: #fff; }
    .chip-100 { background: #16a34a; color: #fff; }
    .chip-500 { background: #0f172a; color: #facc15; border-color: #facc15; }

    .controls { display: flex; gap: 10px; }
    .btn-action { flex: 1; padding: 12px; font-size: 1rem; border-radius: 10px; }
    .btn-roll { background-color: #facc15; color: #0f172a; font-weight: 900; }
    .btn-clear { background-color: #334155; }

    /* Display Mode Overrides */
    body.display-mode .betting-section {
      display: none !important;
    }
    body.display-mode .color-bet-badge {
      display: none !important;
    }
    body.display-mode .stat-coins {
      display: none !important;
    }
    body.display-mode .color-box {
      cursor: default;
    }
  </style>
</head>
<body>

  <header>
    <div class="casino-title">🎰 Grand Public Casino</div>
    <div class="casino-subtitle" id="subtitleText">Player View</div>
  </header>

  <div class="room-bar">
    <div class="room-status-row">
      <div class="room-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Table: YKSP</span>
      </div>
      <button class="btn-toggle" id="toggleDisplayBtn">🖥️ Switch to TV Display Mode</button>
    </div>

    <div class="room-inputs">
      <input type="text" id="roomCodeInput" maxlength="4" value="YKSP" placeholder="TABLE CODE">
      <button id="joinBtn">Join Table</button>
      <button id="hostBtn" class="btn-host">Open Public Table</button>
    </div>
  </div>

  <div class="casino-table">
    <div class="info-header">
      <div class="stat-box stat-coins">
        <div class="stat-label">Your Chips</div>
        <div class="stat-val" id="coinsDisplay">$1,000</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Next Roll</div>
        <div class="stat-val" id="timerDisplay">10s</div>
      </div>
    </div>

    <div class="dice-area">
      <div class="die c-red" id="die0"></div>
      <div class="die c-blue" id="die1"></div>
      <div class="die c-yellow" id="die2"></div>
    </div>

    <!-- Color Grid -->
    <div class="color-grid">
      <div class="color-box c-red" data-color="red"><span class="color-name">Red</span><span class="color-bet-badge" id="bet-red">$0</span></div>
      <div class="color-box c-blue" data-color="blue"><span class="color-name">Blue</span><span class="color-bet-badge" id="bet-blue">$0</span></div>
      <div class="color-box c-yellow" data-color="yellow"><span class="color-name">Yellow</span><span class="color-bet-badge" id="bet-yellow">$0</span></div>
      <div class="color-box c-green" data-color="green"><span class="color-name">Green</span><span class="color-bet-badge" id="bet-green">$0</span></div>
      <div class="color-box c-pink" data-color="pink"><span class="color-name">Pink</span><span class="color-bet-badge" id="bet-pink">$0</span></div>
      <div class="color-box c-white" data-color="white"><span class="color-name">White</span><span class="color-bet-badge" id="bet-white">$0</span></div>
    </div>

    <!-- Interactive Betting Controls (Hidden on Public TV Display) -->
    <div class="betting-section">
      <div class="chip-bar">
        <div class="chip chip-10 selected" data-val="10">$10</div>
        <div class="chip chip-50" data-val="50">$50</div>
        <div class="chip chip-100" data-val="100">$100</div>
        <div class="chip chip-500" data-val="500">$500</div>
      </div>

      <div class="controls">
        <button class="btn-action btn-clear" id="clearBetBtn">Clear Bets</button>
        <button class="btn-action btn-roll" id="rollBtn">Force Roll</button>
      </div>
    </div>
  </div>

  <script>
    const COLORS = ['red', 'blue', 'yellow', 'green', 'pink', 'white'];
    let coins = 1000;
    let selectedChip = 10;
    let bets = { red: 0, blue: 0, yellow: 0, green: 0, pink: 0, white: 0 };
    let dice = ['red', 'blue', 'yellow'];
    let isRolling = false;
    let timeLeft = 10;
    let timerInterval = null;
    let isDisplayMode = false;

    // Networking State
    let peer = null;
    let connections = [];
    let isHost = false;

    // Elements
    const coinsDisplay = document.getElementById('coinsDisplay');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const roomCodeInput = document.getElementById('roomCodeInput');
    const hostBtn = document.getElementById('hostBtn');
    const joinBtn = document.getElementById('joinBtn');
    const toggleDisplayBtn = document.getElementById('toggleDisplayBtn');
    const subtitleText = document.getElementById('subtitleText');
    const rollBtn = document.getElementById('rollBtn');
    const clearBetBtn = document.getElementById('clearBetBtn');
    const dieEls = [document.getElementById('die0'), document.getElementById('die1'), document.getElementById('die2')];

    // Audio Context
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }
    window.addEventListener('click', initAudio);

    function playSound(type) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'chip') {
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
        osc.start(); osc.stop(audioCtx.currentTime + 0.04);
      } else if (type === 'roll') {
        osc.type = 'square';
        osc.frequency.setValueAtTime(120 + Math.random() * 180, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.start(); osc.stop(audioCtx.currentTime + 0.03);
      } else if (type === 'win') {
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
        osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
        osc.start(); osc.stop(audioCtx.currentTime + 0.25);
      }
    }

    // Toggle Public TV Display Mode
    toggleDisplayBtn.addEventListener('click', () => {
      isDisplayMode = !isDisplayMode;
      if (isDisplayMode) {
        document.body.classList.add('display-mode');
        toggleDisplayBtn.textContent = "📱 Switch to Player View";
        subtitleText.textContent = "Public Display Mode";
      } else {
        document.body.classList.remove('display-mode');
        toggleDisplayBtn.textContent = "🖥️ Switch to TV Display Mode";
        subtitleText.textContent = "Player View";
      }
    });

    // Game Engine
    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timeLeft = 10;
      updateUI();

      timerInterval = setInterval(() => {
        if (!isHost) return;
        timeLeft--;
        if (timeLeft <= 0) {
          executeRoll();
        } else {
          broadcastState();
        }
        updateUI();
      }, 1000);
    }

    function placeBet(color) {
      if (isDisplayMode || isRolling || coins < selectedChip) return;
      bets[color] += selectedChip;
      coins -= selectedChip;
      playSound('chip');
      updateUI();
    }

    function clearBets() {
      if (isRolling) return;
      let totalRefund = Object.values(bets).reduce((a, b) => a + b, 0);
      coins += totalRefund;
      for (let c of COLORS) bets[c] = 0;
      updateUI();
    }

    function executeRoll() {
      if (isRolling) return;
      isRolling = true;
      if (timerInterval) clearInterval(timerInterval);

      let rolls = 0;
      const rollEffect = setInterval(() => {
        dice = [
          COLORS[Math.floor(Math.random() * 6)],
          COLORS[Math.floor(Math.random() * 6)],
          COLORS[Math.floor(Math.random() * 6)]
        ];
        playSound('roll');
        rolls++;
        broadcastState();
        updateUI();

        if (rolls > 15) {
          clearInterval(rollEffect);
          isRolling = false;
          calculatePayout();
          if (isHost) startTimer();
        }
      }, 100);
    }

    function calculatePayout() {
      let winnings = 0;
      let hitCount = {};

      dice.forEach(d => hitCount[d] = (hitCount[d] || 0) + 1);

      for (let color in bets) {
        if (bets[color] > 0 && hitCount[color]) {
          winnings += bets[color] + (bets[color] * hitCount[color]);
        }
      }

      if (winnings > 0) {
        coins += winnings;
        playSound('win');
      }

      for (let c of COLORS) bets[c] = 0;
      updateUI();
    }

    function updateUI() {
      coinsDisplay.textContent = `$${coins.toLocaleString()}`;
      timerDisplay.textContent = `${timeLeft}s`;

      COLORS.forEach(c => {
        document.getElementById(`bet-${c}`).textContent = `$${bets[c]}`;
        const box = document.querySelector(`.color-box[data-color="${c}"]`);
        if (!isRolling && dice.includes(c) && timeLeft === 10) {
          box.classList.add('winning');
        } else {
          box.classList.remove('winning');
        }
      });

      dieEls.forEach((el, idx) => {
        el.className = `die c-${dice[idx]} ${isRolling ? 'rolling' : ''}`;
      });

      rollBtn.style.display = isHost ? 'block' : 'none';
    }

    // Networking Logic
    function initHost(customCode) {
      if (peer) peer.destroy();

      const code = (customCode || roomCodeInput.value).trim().toUpperCase() || 'YKSP';
      const peerId = `casino-color-game-${code}`;
      
      peer = new Peer(peerId);

      peer.on('open', () => {
        isHost = true;
        statusDot.className = "status-dot online";
        statusText.textContent = `Table: ${code} (Host)`;
        roomCodeInput.value = code;
        startTimer();
      });

      peer.on('connection', (conn) => {
        connections.push(conn);
        conn.on('open', () => broadcastState());
      });

      peer.on('error', () => {
        alert(`Table code ${code} is already open elsewhere or unavailable.`);
      });
    }

    function joinRoom(customCode) {
      const code = (customCode || roomCodeInput.value).trim().toUpperCase() || 'YKSP';
      if (peer) peer.destroy();

      const targetId = `casino-color-game-${code}`;
      peer = new Peer();

      peer.on('open', () => {
        const conn = peer.connect(targetId);

        conn.on('open', () => {
          isHost = false;
          statusDot.className = "status-dot online";
          statusText.textContent = `Connected: ${code}`;
          if (timerInterval) clearInterval(timerInterval);
        });

        conn.on('data', (data) => {
          if (data.type === 'SYNC_STATE') {
            dice = data.dice;
            timeLeft = data.timeLeft;
            isRolling = data.isRolling;
            updateUI();
          }
        });

        conn.on('close', () => {
          statusDot.className = "status-dot";
          statusText.textContent = "Disconnected";
        });
      });

      peer.on('error', () => {
        alert(`Could not connect to table ${code}. Make sure it is hosted first.`);
      });
    }

    function broadcastState() {
      if (!isHost) return;
      const payload = {
        type: 'SYNC_STATE',
        dice: dice,
        timeLeft: timeLeft,
        isRolling: isRolling
      };
      connections.forEach(conn => conn.send(payload));
    }

    // Event Handlers
    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('selected'));
        chip.classList.add('selected');
        selectedChip = parseInt(chip.dataset.val);
      });
    });

    document.querySelectorAll('.color-box').forEach(box => {
      box.addEventListener('click', () => placeBet(box.dataset.color));
    });

    clearBetBtn.addEventListener('click', clearBets);
    rollBtn.addEventListener('click', () => { if (isHost) executeRoll(); });

    hostBtn.addEventListener('click', () => initHost());
    joinBtn.addEventListener('click', () => joinRoom());

    // Default setup
    updateUI();
  </script>
</body>
</html>
